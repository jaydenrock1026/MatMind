<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mat Mind"><meta name="theme-color" content="#0b0a0b"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Mat Mind</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column phone app, sticky top bar + fixed bottom tab bar; a wrestling-mat circle is the recurring motif */
:root{
  --bg:#0b0a0b; --panel:#161416; --panel2:#201d20; --line:#2e2a2e;
  --fg:#f4f1ee; --muted:#a29a9e; --dim:#6f686c;
  --red:#a8101c; --red-hi:#e23441; --red-soft:rgba(168,16,28,.16);
  --ok:#46a86f; --warn:#d49b2b;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.02;text-wrap:balance;margin:0;text-transform:uppercase}
h1{font-size:clamp(2.3rem,9vw,3.4rem)}
h2{font-size:1.9rem}
h3{font-size:1.3rem}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red-hi)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{width:18px;height:18px;border-radius:50%;border:3px solid var(--red);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 6px var(--fg)}
.sync{font-family:var(--f-mono);font-size:.68rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0e0d0e;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{stroke:var(--red-hi)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:#4a444a}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:#c0141f}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.link{background:none;border:0;padding:0;color:var(--red-hi);font-weight:600}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:hover{border-color:#4a444a}
.tile .k{font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-transform:uppercase;line-height:1.05}
.stat{font-family:var(--f-display);font-weight:900;font-size:2.2rem;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.pill.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pill.red{color:var(--red-hi);border-color:color-mix(in srgb,var(--red-hi) 45%,var(--line))}
.divider{height:1px;background:var(--line)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red-hi);border-radius:99px}
.note{border-left:3px solid var(--red);padding:2px 0 2px 12px;color:var(--muted);font-size:.9rem}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
input[type=text],textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--red-hi)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;min-height:40px;font-family:var(--f-mono);font-size:.9rem;padding:0}
.scale button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* hero with mat */
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:#120e10;padding:26px 18px 22px;isolation:isolate}
.hero .mat{position:absolute;right:-90px;top:50%;width:300px;height:300px;transform:translateY(-50%);border-radius:50%;z-index:-1;opacity:.9;
  background:radial-gradient(circle,transparent 0 10%,var(--red) 10% 12.5%,transparent 12.5% 40%,var(--red) 40% 47%,transparent 47% 70%,rgba(255,255,255,.08) 70% 71%,transparent 71%)}
.hero .mat::after{content:"";position:absolute;left:44%;top:46%;width:12%;height:2.4%;background:var(--fg);opacity:.7;box-shadow:0 14px 0 var(--fg)}
.hero h1 em{font-style:normal;color:var(--red-hi)}

/* lesson typography */
.prose{display:flex;flex-direction:column;gap:12px;max-width:65ch}
.prose p{color:#ddd7d3}
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:11px 13px}
.quiz-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel2))}
.quiz-opt.wrong{border-color:var(--red-hi);background:color-mix(in srgb,var(--red-hi) 12%,var(--panel2))}

/* visualization player */
.player{position:fixed;inset:0;z-index:60;background:#000;color:var(--fg);display:flex;flex-direction:column;justify-content:space-between;padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 22px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.player .ring{width:min(64vw,260px);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:50%;position:relative;
  background:radial-gradient(circle,transparent 0 9%,rgba(168,16,28,.55) 9% 11.5%,transparent 11.5% 39%,rgba(168,16,28,.55) 39% 46%,transparent 46%)}
.player .ring.live{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1);opacity:1}}
.player .line{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,5.5vw,1.9rem);text-transform:none;letter-spacing:.01em;line-height:1.2;text-align:center;min-height:5.2em;color:#e9e3df;max-width:30ch;margin:0 auto;text-wrap:balance;transition:opacity .6s}
.player.dim .line,.player.dim .pcontrols,.player.dim .ptop{opacity:.06}
.player.dim .ring{opacity:.18}
.pcontrols{display:flex;flex-direction:column;gap:14px;transition:opacity .6s}
.pbtn{width:64px;height:64px;border-radius:50%;border:1px solid #3a3438;background:#141114;display:grid;place-items:center}
.pbtn.big{width:78px;height:78px;background:var(--red);border-color:var(--red)}
.pbtn svg{width:26px;height:26px;fill:#fff}
.ptop{display:flex;justify-content:space-between;align-items:center;transition:opacity .6s}

/* breathing */
.box-wrap{position:relative;width:min(78vw,320px);aspect-ratio:1;max-width:100%;margin:0 auto}
.box-wrap svg{width:100%;height:100%;overflow:visible}
.box-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none}
.box-count{font-family:var(--f-display);font-weight:900;font-size:5.2rem;line-height:.9}
.box-phase{font-family:var(--f-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.06em}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.msg.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:140px}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding-block:18px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:85vh;overflow:auto}
.sheet .in{max-width:720px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:10px;z-index:70;font-size:.92rem;max-width:calc(100% - 32px)}

.chart{width:100%;height:auto;display:block}
.codeview{white-space:pre-wrap;font-family:var(--f-body);line-height:1.6;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--red-hi);flex:none;margin-top:1px}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-family:var(--f-mono);font-size:.85rem;display:grid;place-items:center;padding:0}
.day.done{background:var(--red);border-color:var(--red);color:#fff}
.day.today{border-color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body><div id="app"></div><script>
const DIMS={confidence:"Confidence",discipline:"Discipline",focus:"Focus",emotion:"Emotional control",pressure:"Pressure management",resilience:"Resilience"};

const MODULES=[
{id:1,title:"Developing Your Wrestling Identity",skill:"confidence",summary:"Decide who you are on the mat before the match decides it for you.",
lessons:[{h:"Identity drives behavior",ps:["Most wrestlers think in outcomes: win the tournament, place at sectionals, beat the kid who pinned them last year. Outcomes matter, but they are not in your control on any given whistle. Identity is. Identity is the answer to one question: what kind of wrestler am I, regardless of the score?","When your identity is clear, decisions in the match get easier. A wrestler who sees himself as 'the guy who never stops wrestling' does not stall with 20 seconds left in a tied match. He doesn't need to think it through. The identity already made the choice.","Your identity should describe behaviors you can show every match: pace, hand-fighting, finishing shots, getting off bottom, wrestling the full six minutes. 'I am a state champ' is a goal. 'I am relentless on my feet and I finish what I start' is an identity."]},
{h:"Build it from evidence",ps:["Identity is not a slogan you repeat. It is a story backed by proof. Every practice where you finish the last live go as hard as the first is evidence. Every time you get up after being taken down and hand-fight right away is evidence.","Write down three behaviors you want to be known for, then track whether you showed them. Over weeks, the evidence pile becomes the identity. That is why confidence built this way holds up under pressure: it is based on what you have done, not what you hope."]}],
example:"A 132-pounder keeps losing close matches in the third period. He rewrites his identity from 'I want to win more' to 'I win the third period.' He starts finishing every practice with a 2-minute sprint go and counts how often he scores in the last minute. By February he is the one forcing pace late while opponents fade.",
exercise:{name:"Three-word identity",steps:["List ten words that describe the wrestler you want to be.","Cross out any word that describes a result (champion, winner, ranked).","Circle the three that describe behaviors you can show every match.","Write one sentence using all three: 'I am a ___, ___, ___ wrestler.'","Read it before every practice for one week."]},
assignment:"Write your three-word identity and give one piece of evidence from your last practice for each word.",
quiz:[{q:"Which statement is an identity rather than a goal?",o:["I will place at states","I wrestle hard for all six minutes","I want to beat my rival","I want to be ranked"],a:1,w:"An identity describes a behavior you control every match. Placing, beating someone and rankings are outcomes."},
{q:"Why does an identity help late in close matches?",o:["It makes you stronger","It removes the need to decide how to compete","It guarantees a win","It distracts you from the score"],a:1,w:"When you already know who you are, you don't debate whether to keep attacking. The decision is made."},
{q:"What makes an identity believable to yourself?",o:["Repeating it loudly","Posting it online","Evidence from practices and matches","Hearing it from a coach"],a:2,w:"Proof you collected yourself is what makes the identity hold under pressure."}],
reflect:"Think of a match you lost. Which behavior from your identity was missing in that match?"},

{id:2,title:"Mental Toughness",skill:"resilience",summary:"Keep wrestling your best when it is uncomfortable, unfair or exhausting.",
lessons:[{h:"Toughness is a skill, not a trait",ps:["Mental toughness is the ability to keep executing when conditions get bad: you're tired, behind, sore, or the call went against you. Some wrestlers seem born tough, but toughness is mostly trained the same way a single leg is trained: reps under realistic pressure.","Tough wrestlers are not the ones who feel no discomfort. They feel it and act anyway. The skill is shrinking the gap between feeling discomfort and doing the right thing."]},
{h:"Train discomfort on purpose",ps:["Seek controlled hard moments in practice: the extra go, the bad position drill, wrestling from bottom when you hate bottom. Each time, notice the voice that says 'ease off' and practice answering it with a short cue like 'next position.'","Toughness also means recovering fast. The tough wrestler gives up a takedown and is hand-fighting two seconds later, not replaying the mistake."]}],
example:"In the last live go, a 160-pounder is exhausted and stuck on bottom. Instead of laying flat, he repeats 'hips, hands, up' and builds a base three times before getting the stand-up. He doesn't escape every time, but he never quits on the position.",
exercise:{name:"The extra rep",steps:["Pick one moment per practice when you are tired.","Do one more quality rep than you planned.","Say your cue word out loud as you start it.","After practice, write down the moment and what the voice in your head said.","Repeat daily for two weeks."]},
assignment:"Describe the moment in practice when you most want to ease off. Write the exact cue word you will use there.",
quiz:[{q:"Mentally tough wrestlers…",o:["Feel no fatigue","Feel discomfort and still execute","Never make mistakes","Always win close matches"],a:1,w:"Toughness is acting well despite discomfort, not the absence of it."},
{q:"A good way to build toughness is…",o:["Avoiding hard drills","Waiting for big matches","Practicing controlled discomfort with a cue","Only lifting weights"],a:2,w:"Planned, repeated hard reps with a response cue train the skill."},
{q:"After giving up a takedown, a tough wrestler…",o:["Argues the call","Replays it mentally","Resets and hand-fights right away","Slows down to recover"],a:2,w:"Fast recovery is a core part of toughness."}],
reflect:"When was the last time you felt like quitting a position? What would you tell yourself next time?"},

{id:3,title:"Discipline and Consistency",skill:"discipline",summary:"Show up the same way on bad days as on good ones.",
lessons:[{h:"Discipline beats motivation",ps:["Motivation is a feeling. It shows up after a big win and disappears in the middle of January when practice is dark and cold. Discipline is doing what you decided regardless of the feeling.","Wrestling rewards the athlete who stacks small, boring wins: drilling with intent, sleeping enough, eating to fuel, getting to practice early, doing the cooldown. None of these are exciting. Together they separate good from great."]},
{h:"Make standards, not wishes",ps:["A standard is a minimum you meet every day, like 'I drill every rep at match speed' or 'phone off at 10:30.' Standards remove daily debates. You don't decide whether to do it. You already decided.","Keep standards few and specific. Three standards you hit every day beat ten you hit sometimes. When you miss one, don't punish yourself. Just meet it the next day. Consistency is measured over weeks, not days."]}],
example:"A sophomore sets three standards: arrive 10 minutes early, finish every drill rep, and journal for 3 minutes after practice. On days he feels flat, he still hits those three. By the end of the season his coaches trust him in the varsity spot because he is the same every day.",
exercise:{name:"Three standards",steps:["Write three daily standards for the next 14 days.","Make each one specific and checkable (yes or no).","Track them each night.","If you miss one, write what got in the way and how you'll handle it tomorrow."]},
assignment:"Write your three standards and the time of day you will check them.",
quiz:[{q:"The main difference between discipline and motivation is…",o:["Discipline depends on feelings","Motivation is a feeling; discipline is a decision you keep","They are the same","Motivation lasts longer"],a:1,w:"Discipline holds when the feeling fades."},
{q:"A good standard is…",o:["Train harder","Be better","Finish every drill rep at match speed","Win more"],a:2,w:"Specific and checkable."},
{q:"If you miss a standard one day…",o:["Start over next month","Punish yourself","Meet it the next day and learn what got in the way","Drop the standard"],a:2,w:"Consistency is measured over time; one miss isn't failure."}],
reflect:"Which part of your routine slips first when you're tired or stressed?"},

{id:4,title:"Confidence and Self-Belief",skill:"confidence",summary:"Build confidence you can rely on, not confidence that depends on the bracket.",
lessons:[{h:"Where real confidence comes from",ps:["Confidence is your belief that you can perform the skills you need. It comes from three main sources: preparation (you've done the work), past performance (you've done it before), and how you talk to yourself.","Confidence based on results is fragile. Lose once and it's gone. Confidence based on preparation lasts. You can't control whether you win today, but you can know that you drilled your setups 500 times this month."]},
{h:"Talk to yourself like a coach",ps:["Listen to your inner voice before matches. If it sounds like 'don't get taken down' or 'he's ranked, I'm not,' you're coaching yourself toward fear. Swap in instructions: 'win the hand fight,' 'get to my shot,' 'circle and attack.'","Confidence is also shown with the body. Walk to the line with your chest up and eyes forward. Your body language changes how you feel and how your opponent reads you."]}],
example:"Before facing the top seed, a wrestler's mind says 'he'll tech me.' She stops and lists her proof: 'I've hit my high crotch on every partner this week. I've wrestled six full matches without gassing.' Then she sets one task: 'Win the first tie-up.' She loses 5-3, but competes the whole time and scores on him.",
exercise:{name:"Confidence bank",steps:["Write ten specific things you've done in training that prove you are prepared.","Keep the list on your phone.","Read it the night before and the morning of every competition.","Add one new entry after every practice."]},
assignment:"Write five entries for your confidence bank right now.",
quiz:[{q:"The most reliable source of confidence is…",o:["Your record","Your seed","Your preparation","Your opponent's record"],a:2,w:"Preparation is fully in your control and doesn't vanish after a loss."},
{q:"'Don't get taken down' is a weak self-cue because…",o:["It's too long","It focuses on what you fear","It's too aggressive","It's too specific"],a:1,w:"Instructions should point at what to do, not what to avoid."},
{q:"Body language before a match…",o:["Doesn't matter","Affects how you feel and how you're read","Only matters for refs","Should look nervous"],a:1,w:"Posture influences both your own state and your opponent's read."}],
reflect:"What does your inner voice usually say right before a big match? Rewrite it as an instruction."},

{id:5,title:"Focus and Concentration",skill:"focus",summary:"Keep your attention on the next action, not the crowd, score or bracket.",
lessons:[{h:"Attention is your most limited resource",ps:["In a match you have about six minutes of attention to spend. Wrestlers waste it on the crowd, the coach in the stands, the score, the ref, and the next round. Every second spent there is a second not spent reading your opponent's hips.","Focus is not staring hard. It is choosing where attention goes and bringing it back quickly when it drifts. Drifting is normal. Returning fast is the skill."]},
{h:"Narrow, then widen",ps:["Before the match your focus can be wide: game plan, scouting, warm-up. Once the whistle blows, narrow it to the present position: hands, head, hips, feet. Between periods widen briefly to hear your coach, then narrow again.","Use a reset trigger, like touching the center circle or adjusting your headgear, to bring attention back after a stoppage."]}],
example:"A wrestler hears his name and his dad yelling from the stands right after a stalemate. He taps his ankle band at the edge of the circle, says 'hands first,' and steps back in focused on the tie-up instead of the noise.",
exercise:{name:"Two-minute present focus",steps:["Sit and set a timer for 2 minutes.","Focus only on your breath at your nostrils.","Each time your mind wanders, say 'back' silently and return.","Count how many times you returned. More returns means more reps, not failure.","Do this daily for a week."]},
assignment:"Pick your reset trigger (a physical action) and write the cue word that goes with it.",
quiz:[{q:"During live wrestling, attention should be on…",o:["The score","The crowd","The present position","The next round"],a:2,w:"Narrow focus on hands, head, hips and feet wins positions."},
{q:"When your focus drifts, the key skill is…",o:["Never drifting","Returning quickly","Getting angry at yourself","Ignoring it"],a:1,w:"Drifting is normal; fast return is the skill."},
{q:"A reset trigger is…",o:["A rule violation","A physical action that brings attention back","A coach's signal","A type of takedown"],a:1,w:"A repeatable action paired with a cue word."}],
reflect:"What pulls your attention most in matches: the crowd, the score, the ref, or your own thoughts?"},

{id:6,title:"Aggression and Competitive Mentality",skill:"confidence",summary:"Wrestle to score, not to survive. Controlled aggression wins.",
lessons:[{h:"Controlled aggression",ps:["Aggression in wrestling means taking initiative: pressuring, attacking, forcing your opponent to react. It is not anger. Angry wrestlers make wild shots and give up position. Controlled aggression is intense effort aimed at a plan.","The competitive mentality is 'I'm here to score.' Wrestlers who wrestle not to lose stop attacking when they get a lead and often give it back."]},
{h:"Set the pace",ps:["Whoever sets the pace usually sets the outcome. Pressure means constant hand-fighting, moving forward, and attacking in short chains so your opponent can't settle.","If you're naturally passive, set a rule: attack within 10 seconds of every restart on your feet. Make aggression a habit, not a mood."]}],
example:"Up 4-2 in the third period, a wrestler feels the urge to back up and protect the lead. He remembers his rule: 'Score again.' He keeps hand-fighting, hits a low single with 40 seconds left, and wins 7-3 instead of holding on.",
exercise:{name:"Ten-second rule",steps:["In live goes this week, attack within 10 seconds of every restart on your feet.","Have a partner or coach count if possible.","Track how many restarts you met the rule.","Notice how your opponent reacts when you pressure first."]},
assignment:"Write your rule for what you'll do when you get a lead.",
quiz:[{q:"Controlled aggression is…",o:["Wrestling angry","Intense effort aimed at a plan","Shooting from far away","Talking trash"],a:1,w:"Aggression without control gives up positions."},
{q:"Wrestling 'not to lose' usually leads to…",o:["Bigger leads","Stalling and giving leads back","Better conditioning","More pins"],a:1,w:"Protecting a lead often invites pressure and stall calls."},
{q:"Setting the pace means…",o:["Waiting for mistakes","Constant pressure and attacking in chains","Wrestling slowly","Only defending"],a:1,w:"Pressure forces your opponent to react to you."}],
reflect:"When you get a lead, what do you usually do? What do you want to do?"},

{id:7,title:"Handling Fear, Anxiety, and Pressure",skill:"pressure",summary:"Nerves are normal. Learn to use them instead of fighting them.",
lessons:[{h:"Nerves are energy",ps:["The racing heart, tight stomach and shaky hands before a match are your body getting ready to compete. The same signals happen when you're excited. What changes is the story you tell about them.","Instead of 'I'm nervous, something's wrong,' try 'I'm ready, my body is getting fired up.' Research on reframing arousal suggests that calling it excitement can help performance more than trying to calm down completely."]},
{h:"Shrink the moment",ps:["Pressure grows when you think about everything the match means: rankings, parents, college, your rival. Shrink it back to the size of the mat. The match is a series of positions. Your only job is the next one.","Use your breathing to bring arousal to the right level. A few slow breaths with longer exhales can settle you if you're too amped. Short sharp breaths and movement can bring you up if you're flat."]}],
example:"Before her first state match, a wrestler feels sick. She tells herself, 'This is my body getting ready.' She does six slow breaths with long exhales, jogs in place, and sets one task: 'Win the first hand fight.' The nerves don't disappear, but they stop running the show.",
exercise:{name:"Reframe and task",steps:["Write the physical signs you feel before matches.","Next to each, write the reframe ('heart racing = ready').","Choose one breathing pattern for when you're too amped.","Choose one first-task cue for the opening seconds.","Practice the full sequence before every live go this week."]},
assignment:"Write your biggest competition fear and one sentence that shrinks it back to the next position.",
quiz:[{q:"Pre-match nerves are best understood as…",o:["A sign you'll lose","Your body preparing to compete","Something to eliminate","Weakness"],a:1,w:"The same arousal can be read as readiness."},
{q:"To shrink a big moment, focus on…",o:["What the win means","The next position","Who is watching","Your seed"],a:1,w:"Positions are controllable; meaning is not."},
{q:"If you're too amped before a match, try…",o:["Slow breaths with longer exhales","Holding your breath","Thinking about rankings","Skipping warm-up"],a:0,w:"Longer exhales tend to bring arousal down."}],
reflect:"What thought makes you most nervous before matches? Where does it come from?"},

{id:8,title:"Losing, Failure, and Adversity",skill:"resilience",summary:"Every wrestler loses. What you do in the next 24 hours matters most.",
lessons:[{h:"Losing is information",ps:["Even the best wrestlers in the world lose matches. Losing hurts because you care, and that's a good sign. But a loss is data about what to fix, not a verdict on who you are.","Separate the person from the performance. 'I lost that match' is true. 'I'm a loser' is a story you add. The first leads to learning. The second leads to quitting."]},
{h:"The 24-hour rule",ps:["Give yourself time to feel the loss. Then, within 24 hours, do a short review: what went well, what broke down, and one thing to train this week. Then let it go.","Adversity inside a match works the same way: you got taken down, the call went against you, you're down 6-0. Accept it fast ('that happened'), then ask 'what's next?' Wrestlers who come back from big deficits stopped arguing with what already happened."]}],
example:"After losing in the blood round, a wrestler sits with it that night. The next day he writes: 'Good: hand-fighting in the first period. Broke down: got ridden out in the second. Train: stand-ups from bottom this week.' He wins his next tournament on a third-period escape.",
exercise:{name:"Post-loss review",steps:["Wait until you've calmed down (but within 24 hours).","Write two things that went well.","Write one thing that broke down.","Write one specific drill or habit to train this week.","Close the notebook and move on."]},
assignment:"Do a post-loss review for your most recent loss (or toughest practice).",
quiz:[{q:"'I lost that match' versus 'I'm a loser' shows…",o:["They mean the same","Separating performance from identity","Both are healthy","Neither matters"],a:1,w:"Performance can change; a label keeps you stuck."},
{q:"The 24-hour rule means…",o:["Never think about losses","Feel it, review it briefly, then move on","Train for 24 hours","Don't wrestle for a day"],a:1,w:"Process the loss, extract the lesson, let it go."},
{q:"When you fall behind in a match, the first step is…",o:["Argue the call","Accept it and ask what's next","Wrestle safer","Look at your coach"],a:1,w:"Acceptance frees attention for the next action."}],
reflect:"How do you usually talk to yourself after a loss? Is it helping you get better?"},

{id:9,title:"Visualization and Mental Rehearsal",skill:"focus",summary:"Practice the match in your head so your body has been there before.",
lessons:[{h:"Why mental rehearsal works",ps:["When you vividly imagine performing a skill, your brain activates many of the same areas used to actually perform it. Imagery doesn't replace practice, but adding it to practice can help with skill, confidence and handling pressure.","The key word is vivid. Good visualization uses all your senses: the smell of the gym, the tape on your fingers, the sound of shoes on the mat, the grip of a collar tie, the feeling of your heart rate rising."]},
{h:"How to visualize well",ps:["See it from your own eyes (first person) for match feel, and from the stands (third person) to check technique. Rehearse at real speed. Include adversity: give up a takedown in your imagination and practice responding calmly.","Keep sessions short: 3 to 10 minutes. Do them consistently, especially the night before and the morning of a match. The Visualization Room in this app is built for exactly this."]}],
example:"A wrestler visualizes his finals match every night for a week, including being taken down first and calmly escaping. When it actually happens in the finals, he feels like he's been there, because mentally he has.",
exercise:{name:"Five-sense rehearsal",steps:["Close your eyes and breathe slowly for 30 seconds.","Picture the arena: what do you see, hear, smell?","Feel your feet on the mat and your hands in the first tie-up.","Run through scoring your best takedown at full speed.","Rehearse one bad moment and your calm response.","Open your eyes and write one detail you noticed."]},
assignment:"Complete one session in the Visualization Room and write the most vivid detail you experienced.",
quiz:[{q:"Visualization works best when it is…",o:["Vague and relaxed","Vivid and multi-sensory","Only visual","Done once a month"],a:1,w:"Using all senses makes imagery more effective."},
{q:"Why rehearse adversity in your head?",o:["To make you nervous","So your response feels familiar when it happens","It's bad luck","It isn't useful"],a:1,w:"Practicing the response prepares you for real setbacks."},
{q:"A good visualization session length is…",o:["30 seconds","3–10 minutes","An hour","Only before states"],a:1,w:"Short and consistent works."}],
reflect:"When you imagine your next big match, what do you see first? Is it helpful?"},

{id:10,title:"Emotional Control",skill:"emotion",summary:"Feel everything. Let nothing take the steering wheel.",
lessons:[{h:"Emotions are signals, not orders",ps:["Anger, frustration and fear will show up in matches. That's normal. The problem is when emotion starts making decisions: a frustrated wrestler throws a reckless headlock, an angry wrestler argues with the ref and loses focus for the next restart.","The goal is not to feel nothing. It is to notice the emotion, name it, and choose your next action anyway."]},
{h:"Name it, breathe, act",ps:["Naming an emotion ('that's frustration') can reduce its intensity. Follow it with one controlled breath and a specific action cue. This takes about three seconds and fits in any stoppage.","Watch for your personal triggers: a bad call, a stalling warning, being ridden, a trash-talking opponent. Plan your response to each in advance so you're not inventing it in the heat of the moment."]}],
example:"After a stalling call against him, a wrestler feels his face get hot. He walks to the edge, says 'frustrated,' takes one long exhale, and says 'hands and pressure.' He scores the next takedown instead of picking up a second warning.",
exercise:{name:"Trigger plan",steps:["List your three biggest emotional triggers in matches.","For each, write the emotion it causes.","Write a 3-second response: name it, breathe, cue word.","Practice by having a partner simulate a trigger in practice (a fake bad call)."]},
assignment:"Write your trigger plan for the trigger that costs you the most.",
quiz:[{q:"The goal of emotional control is…",o:["Feeling nothing","Letting emotions guide you","Noticing emotions and choosing your action","Hiding emotions"],a:2,w:"Emotions are signals; you still choose the action."},
{q:"Naming an emotion can…",o:["Make it worse","Reduce its intensity","Get you penalized","Slow you down"],a:1,w:"Labeling helps create space between feeling and action."},
{q:"A trigger plan is useful because…",o:["You avoid all triggers","You don't invent responses mid-match","Refs will be nicer","It replaces practice"],a:1,w:"Pre-planned responses are faster and calmer."}],
reflect:"Describe the last time an emotion cost you a position or a match."},

{id:11,title:"Match Intelligence and Mental Strategy",skill:"focus",summary:"Wrestle with a plan and adjust it in real time.",
lessons:[{h:"Have a plan before the whistle",ps:["Smart wrestlers walk out with a simple plan: two or three keys like 'get to my outside single,' 'stay heavy on top,' 'stand up immediately on bottom.' Plans should come from your strengths and anything you know about your opponent.","Keep it simple. Under pressure, nobody remembers ten instructions. Three keys you actually execute beat a perfect plan you forget."]},
{h:"Read and adjust",ps:["Matches change. If your opponent shuts down your favorite shot, you need a second option. Between periods, ask: what's working, what isn't, what's one change? Your coach helps, but you need to read the match too.","Know the clock and the score. Choosing top, bottom or neutral in the second period, knowing when riding time matters, and managing the edge of the mat are all part of match intelligence."]}],
example:"In the first period, every time a wrestler shoots his double, the opponent sprawls hard. At the break he notes it and switches to snapping down off the sprawl reaction. He scores a front headlock go-behind in the second.",
exercise:{name:"Three keys",steps:["Before your next match or live go, write three keys.","One for neutral, one for top, one for bottom.","After the match, grade each key: did you execute it?","Write one adjustment you would make."]},
assignment:"Write your three keys for your next match.",
quiz:[{q:"A good match plan has…",o:["Ten detailed instructions","Two or three simple keys","No structure","Only defense"],a:1,w:"Simple keys survive pressure."},
{q:"If your best shot isn't working…",o:["Keep forcing it","Have a second option ready","Stop attacking","Wait for the third period"],a:1,w:"Adjusting is part of match intelligence."},
{q:"Between periods you should ask…",o:["Who's watching","What's working, what isn't, one change","What the bracket looks like","Nothing"],a:1,w:"A quick self-review sharpens the next period."}],
reflect:"How often do you wrestle with a clear plan? What happens when you don't?"},

{id:12,title:"Fatigue and Recovery Mindset",skill:"resilience",summary:"Fatigue makes cowards of us all, unless you've trained your mind for it.",
lessons:[{h:"Tired is a feeling, not a stop sign",ps:["In the third period, your body sends strong 'stop' signals well before you're truly empty. Many wrestlers slow down at the first wave of fatigue. The ones who win late have learned that the first wave is a warning, not a limit.","Train this in practice: when the wave hits, focus on small tasks like 'hands, feet, breathe.' Narrow focus makes fatigue more manageable."]},
{h:"Recovery is part of training",ps:["Mental recovery matters as much as physical recovery. After hard days, wind down: breathe, eat, hydrate, sleep. A tired mind makes poor decisions and loses motivation faster.","Between matches at tournaments, recover deliberately: get off your feet, refuel and rehydrate sensibly, do a short breathing session, then rebuild energy before your next match."]}],
example:"At a two-day tournament, a wrestler sits in the bleachers watching everyone's matches for hours. His teammate rests with headphones, does box breathing, eats and stretches. The teammate wrestles fresher in the semis.",
exercise:{name:"Third-period cue",steps:["Choose one short cue for when fatigue hits (e.g. 'hands, feet, breathe').","In the last live go of each practice, use it the moment you feel tired.","After practice, rate how well you kept pace (1–10).","Track for two weeks."]},
assignment:"Write your tournament recovery routine for between matches.",
quiz:[{q:"The first wave of fatigue is usually…",o:["Your true limit","A warning, not a limit","A sign to stop","An injury"],a:1,w:"Most athletes have more left after the first wave."},
{q:"When tired, a helpful focus is…",o:["The whole match","Small tasks like hands and feet","The score","How tired you are"],a:1,w:"Narrow tasks make fatigue manageable."},
{q:"Between tournament matches, you should…",o:["Watch every match standing up","Recover deliberately","Skip food","Stay amped all day"],a:1,w:"Deliberate recovery keeps you fresh."}],
reflect:"How do you behave when you're exhausted in a match? What do you want to change?"},

{id:13,title:"Pre-Match Mental Preparation",skill:"pressure",summary:"Build a routine that gets you to the line ready every time.",
lessons:[{h:"Why routines work",ps:["A pre-match routine makes every match feel familiar, whether it's a dual meet or a state final. It tells your body and mind 'this is what we do before we compete.' It also gives your nervous energy a job.","A routine has three parts: physical warm-up, mental prep, and a final trigger to switch on."]},
{h:"Build yours",ps:["Physical: get a sweat, move through your stance, motion and shots. Mental: a short visualization, breathing to set your energy, and reviewing your three keys. Trigger: a final action before stepping on the mat, like slapping your legs, a deep breath, or a cue phrase.","Time your routine. If you have 20 minutes, do the full version. If the bracket moves fast and you have 5 minutes, have a short version ready."]}],
example:"A wrestler's routine: 10 minutes warm-up, 3 minutes visualization, 1 minute box breathing, read his three keys, then slap his thighs twice and say 'go to work' before walking to the line. He uses the same routine every match all season.",
exercise:{name:"Write your routine",steps:["Write a full 20-minute routine (physical, mental, trigger).","Write a 5-minute short version.","Practice the routine before a live go this week.","Adjust anything that feels forced."]},
assignment:"Write your full and short pre-match routines. Add them to My Wrestling Code.",
quiz:[{q:"The three parts of a routine are…",o:["Eat, sleep, wrestle","Physical, mental, trigger","Stretch, talk, shoot","Weigh-in, warm-up, cool-down"],a:1,w:"Each part prepares a different system."},
{q:"Why have a short version?",o:["Brackets can move fast","It's more fun","Long routines are bad","Coaches prefer it"],a:0,w:"You need a version that fits any timing."},
{q:"A trigger is…",o:["A final action that switches you on","A takedown","A penalty","A type of warm-up"],a:0,w:"It marks the moment you're ready."}],
reflect:"What do you usually do in the 10 minutes before a match? Does it help?"},

{id:14,title:"In-Match Mental Control",skill:"emotion",summary:"Stay in the match, one position at a time.",
lessons:[{h:"One position at a time",ps:["A match is a chain of positions: neutral, a tie-up, a shot, a scramble, top, bottom. Each position is its own mini-battle. Wrestlers lose control when they jump ahead ('I need two more takedowns') or look back ('I can't believe he scored').","Stay in the current position. Ask 'what does this position need?' and do it."]},
{h:"Use stoppages",ps:["Every stoppage is a chance to reset: out of bounds, blood time, between periods. Use a two-step reset: one breath, one cue. Don't use stoppages to argue, look at the crowd, or replay mistakes.","Know your cues for each position: neutral ('hands, head, pressure'), top ('heavy hips, break him down'), bottom ('base, hands, up')."]}],
example:"Down 3-0, a wrestler starts bottom in the second. Instead of thinking about the deficit, he focuses on 'base, hands, up.' He gets an escape, then a takedown, and wins 4-3.",
exercise:{name:"Position cues",steps:["Write one cue for neutral, top and bottom.","Say each cue out loud before drilling that position this week.","In live goes, use them during every stoppage.","Note which cue helped most."]},
assignment:"Write your neutral, top and bottom cues.",
quiz:[{q:"Losing control often happens when you…",o:["Focus on the current position","Jump ahead or look back","Use a cue","Breathe"],a:1,w:"Future and past steal present attention."},
{q:"A good use of a stoppage is…",o:["Arguing the call","One breath and one cue","Looking at the crowd","Replaying mistakes"],a:1,w:"Stoppages are reset opportunities."},
{q:"Position cues should be…",o:["Long and detailed","Short and specific to the position","The same for all positions","Optional"],a:1,w:"Short cues work under pressure."}],
reflect:"What thought pulls you out of the current position most often?"},

{id:15,title:"Post-Match Analysis",skill:"discipline",summary:"Turn every match into a lesson, win or lose.",
lessons:[{h:"Review every match",ps:["Most wrestlers only analyze losses. But wins hide mistakes too: a takedown you gave up, a period you coasted. Review every match the same way so you learn from all of them.","Do it soon, but not immediately. Give yourself a few minutes to cool down, then answer three questions: what worked, what broke down, what's my one fix?"]},
{h:"Use film and data",ps:["If you have video, watch your match once for the overall flow, then again for one specific thing (your hand-fighting, your bottom, your finishes). Notice patterns across several matches.","Track simple stats: takedowns scored and allowed, escapes, how often you're first to score. Patterns tell you what to train. Use this app's journal to log your answers."]}],
example:"A wrestler wins 8-5 and feels great, but in his review notices he gave up both takedowns from the same underhook. He spends the next week on underhook defense and doesn't give it up again.",
exercise:{name:"Three-question review",steps:["After every match, wait 10–30 minutes.","Answer: what worked? What broke down? What's my one fix?","Log it in the journal (after winning / after losing templates).","Every two weeks, read back and look for patterns."]},
assignment:"Do a three-question review for your last match or live go.",
quiz:[{q:"Why review wins too?",o:["You don't need to","Wins can hide mistakes","To brag","Coaches require it"],a:1,w:"Every match has lessons."},
{q:"The three review questions are…",o:["Who, what, where","What worked, what broke down, one fix","Score, time, ref","Win, lose, draw"],a:1,w:"Simple and repeatable."},
{q:"Watching film for one specific thing helps because…",o:["It's faster","Focused review reveals patterns","It's more fun","It replaces practice"],a:1,w:"Specific focus makes patterns visible."}],
reflect:"What patterns have you noticed across your last few matches?"},

{id:16,title:"Building Your Personal Wrestling Philosophy",skill:"discipline",summary:"Put it all together into a code you live by.",
lessons:[{h:"Your philosophy",ps:["A wrestling philosophy is your answer to why you wrestle, how you compete and what you stand for. It ties together your identity, your standards, your routines and how you handle adversity.","Great wrestlers can usually describe theirs in a few sentences. It guides them when motivation fades, when they lose, and when they win and need to stay hungry."]},
{h:"Write it, live it, update it",ps:["Write your philosophy in your own words. Use what you've learned in every module: your identity words, your standards, your pre-match routine, your trigger plans, your response to losing.","Read it regularly and update it as you grow. A freshman's philosophy should look different from a senior's. The My Wrestling Code feature in this app helps you build and save yours."]}],
example:"A senior's code: 'I wrestle because it makes me better at everything else. I compete for six full minutes, I attack first, and I never argue with what already happened. My standards: early to practice, every rep at match speed, sleep by 10:30. When I lose, I learn. When I win, I review.'",
exercise:{name:"Draft your code",steps:["Open My Wrestling Code.","Fill in every section in your own words.","Generate your code document.","Read it aloud. Edit anything that doesn't sound like you.","Read it before every competition."]},
assignment:"Complete My Wrestling Code and write the one line from it that matters most to you.",
quiz:[{q:"A wrestling philosophy includes…",o:["Only your goals","Why you wrestle, how you compete, what you stand for","Your record","Your weight class"],a:1,w:"It's the full picture of how you compete."},
{q:"Your philosophy should…",o:["Never change","Grow as you grow","Be copied from someone else","Be kept secret from yourself"],a:1,w:"Update it as you develop."},
{q:"The best time to read your code is…",o:["Never","Before competitions and when motivation fades","Only after losses","Only in summer"],a:1,w:"It guides you when you need it most."}],
reflect:"Why do you wrestle? Write the honest answer."}
];

["You don't celebrate. You stay heavy. Next position.",6],
["Breathe. You started this match on your terms.",5],
["Open your eyes.",3]]},
{id:"gameplan",letter:"F",title:"Executing Your Game Plan",skill:"focus",env:"hs",lines:[
["Close your eyes. Settle your breathing.",5],
["You walk out with three keys. Say them to yourself now.",7],
["First period. You stick to key one. You hand-fight, set up, and score.",7,"squeak"],
["Second period. You choose your position. You know why you chose it.",6],
["On top: hips heavy, chop, break him down. Feel him flatten out.",7],
["On bottom: base, hands, up. Feel yourself stand and cut free.",7,"cheer"],
["Something stops working. You notice. You switch to your second option.",6],
["Between periods, your coach talks. You hear one thing: the adjustment.",6],
["Third period. The plan still holds. You execute without overthinking.",6],
["The match ends. Win or lose, you wrestled your plan. That's a performance you can build on.",6,"whistle"],
["Open your eyes when you're ready.",3]]},
{id:"behind",letter:"G",title:"Wrestling From Behind",skill:"resilience",env:"hs",lines:[
["Close your eyes. Breathe in slowly.",5],
["Picture the scoreboard. You're down 5 to 1 in the second period.",5],
["Notice the urge to panic or rush. Let it be there.",6],
["Take one breath. Say: that happened. What's next?",6],
["You start bottom. Base, hands, up. You fight his hands and stand.",6,"squeak"],
["Escape. Five to two. The ref's hand goes up for one point.",5,"cheer"],
["Back on your feet. You don't shoot wildly. You hand-fight and set it up.",6],
["He's getting tired. You feel it in his hands. You increase the pace.",6],
["Low single. Finish. Five to five.",5,"roar"],
["Third period. You don't stop. Pressure, pressure, pressure.",6],
["Whatever the final score, you never stopped wrestling. That's who you are.",6,"whistle"],
["Open your eyes.",3]]},
{id:"adversity",letter:"H",title:"Handling Adversity",skill:"emotion",env:"hs",lines:[
["Close your eyes. Breathe slowly.",5],
["You're in a close match. You go for a shot and get called for a slam that you don't agree with.",6,"whistle"],
["Feel the heat rise in your face. Name it: frustration.",6],
["Take one long exhale. Longer than the inhale.",7],
["Walk to the edge. Touch the circle. Say your cue word.",6],
["You come back to the center calm. The call is over.",5],
["Now imagine you tweak your shoulder in a scramble. It hurts, but you're cleared to continue.",6],
["Notice the worry. Then come back to what you control: your hands, your feet, your effort.",7],
["The crowd groans at a stall call against you. You let it pass.",5,"hush"],
["One position at a time. Base, hands, pressure.",6],
["You handled it. Adversity didn't run your match. You did.",6],
["Open your eyes.",3]]},
{id:"calm",letter:"I",title:"Staying Calm Under Pressure",skill:"pressure",env:"champ",lines:[
["Close your eyes. Take a slow breath in for four. Out for six.",8],
["Tied match. Thirty seconds left in the third period.",5],
["Notice your heart pounding. That's energy, not danger.",6,"roar"],
["Your breathing slows. In for four. Out for six.",9],
["You're not thinking about the bracket. Just this position.",5],
["Hand fight. Head position. Stay in good stance.",6,"squeak"],
["You feel him lean. You stay patient. You don't force it.",6],
["The opening comes. You take it with control, not panic.",6],
["Whatever happens, you stay composed. Composure is a choice you're making right now.",6,"cheer"],
["Another breath. Long exhale.",7],
["Calm under pressure is a skill you're training today.",5],
["Open your eyes when you're ready.",3]]},
{id:"win",letter:"J",title:"Winning The Match",skill:"confidence",env:"big",lines:[
["Close your eyes. Breathe in slowly.",5],
["Third period. You're up two. You keep attacking.",5,"squeak"],
["Ten seconds. Five. The buzzer.",5,"whistle"],
["The crowd reacts. Feel the release of six minutes of work.",6,"roar"],
["You shake your opponent's hand. You shake his coach's hand.",5],
["The ref raises your arm. Feel it. Notice exactly how it feels.",7,"applause"],
["You worked for this moment. Every early morning. Every last go.",6],
["Walk off the mat with respect. Hug your coach.",5],
["Now notice: you're already thinking about what you can improve. Winners review wins too.",6],
["Hold onto this feeling. It's proof of what your preparation can do.",6],
["Open your eyes.",3]]},
{id:"lose",letter:"K",title:"Losing And Responding With Confidence",skill:"resilience",env:"hs",lines:[
["Close your eyes. Breathe slowly.",5],
["The buzzer sounds. You lost a close one.",5,"whistle"],
["Feel the disappointment. It's okay. It means you care.",6],
["You shake hands with your head up. You walk off with control.",6],
["Your coach puts a hand on your shoulder. You listen.",5],
["You find a quiet spot. You let yourself feel it for a minute.",7],
["Then you breathe. In slowly. Out longer.",8],
["You say: I lost that match. I'm not a loser.",6],
["You ask: what's one thing I'll fix this week?",6],
["See yourself back in the practice room on Monday, drilling that exact thing.",6],
["See yourself in the next tournament, stronger because of this.",6,"cheer"],
["Open your eyes when you're ready.",3]]},
{id:"champ",letter:"L",title:"Championship Match Visualization",skill:"pressure",env:"finals",lines:[
["Close your eyes. Breathe in slowly. Hold for a second. Let it out.",6],
["It's the championship final. The other mats are rolled up. One mat, under the lights.",6],
["The announcer calls your name. The crowd stands.",5,"roar"],
["Walk to the center. Feel the spotlight warm on your shoulders.",6],
["You've imagined this many times. Today you're ready for it.",5],
["Handshake. Whistle.",4,"whistle"],
["First period: you set the pace. Hands, pressure, attack.",6,"squeak"],
["Second period: he scores. You respond immediately. That happened. What's next.",6],
["Third period: you're tired. So is he. You've trained for this exact feeling.",6],
["Hands, feet, breathe. You push the pace one more time.",6,"cheer"],
["Whatever the scoreboard says, you wrestled six full minutes like a champion.",6],
["The final buzzer.",4,"applause"],
["Breathe. Open your eyes when you're ready.",3]]}
];

topic("fear","Fear of losing","pressure","Fear of losing is one of the most common things wrestlers deal with. Let's figure out what's underneath it.",
 {ask:"When does it hit hardest?",key:"when",type:"choice",opts:["Night before","Warm-up","Walking to the mat","During the match","Against good opponents"]},
 {ask:"What exactly are you afraid will happen if you lose?",key:"fear",type:"text",ph:"Letting my team down, looking bad"},
 "Fear of losing usually comes from tying your worth to the result. When the result feels like a verdict on you, your body protects you by tightening up, and you wrestle not to lose. The fix is moving your focus from the outcome, which you don't control, to positions and effort, which you do.",
 "1. Write your fear down exactly as it sounds in your head.\n2. Under it, write: \"What I control is ___.\" Fill in three things (hand-fighting, pace, getting off bottom).\n3. Before your next match, read only the bottom half.",
 [["Session: Walking into the arena","viz:arena"],["Module 7: Fear, anxiety and pressure","module:7"]]);
topic("anxiety","Competition anxiety","pressure","Nerves before competing are normal. Let's make them work for you instead of against you.",
 {ask:"What does it feel like in your body?",key:"body",type:"choice",opts:["Stomach is sick","Heart racing","Shaky, weak","Can't stop thinking","All of it"]},
 {ask:"What's the thought that shows up with it?",key:"thought",type:"text",ph:"What if I get taken down right away"},
 "Your body does the same thing before a match as it does when you're excited: heart rate up, adrenaline, butterflies. The difference is the label. Calling it \"ready\" instead of \"scared\" helps you use the energy. If it's too much, long exhales bring it down.",
 "1. Name the feeling: \"That's my body getting ready.\"\n2. Do six breaths: in for 4, out for 6.\n3. Set one task for the first 10 seconds: \"Win the first hand fight.\"",
 [["Pre-match breathing, 2 minutes","breath:pre:2"],["Session: Staying calm under pressure","viz:calm"]]);
topic("confidence","Low confidence","confidence","Confidence isn't something you either have or don't. It's built. Let's find where yours is leaking.",
 {ask:"When do you feel least confident?",key:"when",type:"choice",opts:["Against ranked kids","After a loss","In practice","When I'm behind","All the time lately"]},
 {ask:"Name one thing you've done this season you're proud of, even something small.",key:"proud",type:"text"},
 "Real confidence comes from evidence: work you've put in and things you've already done. Confidence based on results disappears after one loss. Confidence based on preparation stays. Your job is to collect proof and read it when doubt shows up.",
 "1. Write five specific things you've done in practice that prove you're prepared.\n2. Save them in your proof list (good practice and good match debriefs add to it automatically).\n3. Read the list the night before and the morning of every competition.",
 [["Session: Standing across from your opponent","viz:opponent"],["Module 4: Confidence and self-belief","module:4"]]);
topic("discipline","Lack of discipline","discipline","Discipline is a skill, not a personality. Let's find where it's breaking down.",
 {ask:"What slips first?",key:"slips",type:"choice",opts:["Sleep","Eating right","Effort in drills","Showing up early","Extra work outside practice"]},
 {ask:"What usually gets in the way?",key:"why",type:"text",ph:"Phone at night, friends, tired after school"},
 "Motivation is a feeling and it comes and goes. Discipline is a decision you make once so you don't have to keep making it. The trick is a few small standards you hit every day, not a big plan you hit sometimes.",
 "1. Pick three daily standards (yes-or-no things).\n2. Check them every night for 14 days.\n3. Miss one? No punishment. Just hit it the next day.",
 [["Module 3: Discipline and consistency","module:3"],["Start the 30-day challenge","go:challenge"]]);
topic("frustration","Frustration and anger","emotion","Frustration on the mat costs positions. Let's build a plan for when it shows up.",
 {ask:"What sets you off most?",key:"trigger",type:"choice",opts:["Bad calls","Getting ridden","Can't score","Trash talk","Making the same mistake"]},
 {ask:"What do you usually do when it hits?",key:"react",type:"text",ph:"Throw a wild headlock, stop listening to coach"},
 "Emotions are signals, not orders. You can feel frustrated and still choose your next move. Naming the emotion actually turns it down a little, and one long breath buys you the second you need to pick your action.",
 "1. Name it: \"That's frustration.\"\n2. One long exhale.\n3. Say your cue word and go to the next position.\nPractice it in drills by having a partner give you fake bad calls.",
 [["Session: Handling adversity","viz:adversity"],["Module 10: Emotional control","module:10"]]);
topic("focus","Focus problems","focus","Focus is where your attention goes. Let's figure out where yours is wandering.",
 {ask:"What pulls your attention most?",key:"pull",type:"choice",opts:["The crowd","The score","My coach or parents","Thinking ahead","Replaying mistakes"]},
 {ask:"When in a match do you lose focus most?",key:"when",type:"text",ph:"After I give up points"},
 "Nobody stays focused the whole time. The skill is noticing you drifted and coming back fast. A reset trigger, a physical action plus a cue word, makes coming back automatic.",
 "1. Pick a reset action (tap your ankle band, touch the circle).\n2. Pair it with a cue word (\"hands first\").\n3. Use it at every stoppage in practice this week.",
 [["Session: Hearing the crowd","viz:crowd"],["Module 5: Focus and concentration","module:5"]]);
topic("pressure","Performance pressure","pressure","Pressure shows up when a match feels like it means more than six minutes. Let's shrink it back down.",

 try{const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);

  const uid=await user.id();if(!uid){paintSync();return}

  const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);

const Voice={voices:[],load(){if(!("speechSynthesis" in window))return;this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))},
 pick(){const want=S.viz.voice;return this.voices.find(v=>v.name===want)||this.voices.find(v=>/en-US/i.test(v.lang)&&/natural|enhanced|premium|google/i.test(v.name))||this.voices.find(v=>/en-US/i.test(v.lang))||this.voices[0]},

/* ----- player ----- */
const PL={on:false,s:null,idx:0,playing:false,elapsed:0,total:0,tick:null,wait:null,dimT:null,wake:null,ambient:false,
 scale(){return{short:.65,standard:1,extended:1.6}[S.viz.length]||1},
 open(id){const s=allViz().find(v=>v.id===id);if(!s)return;this.s=s;this.idx=0;this.elapsed=0;this.ambient=S.viz.mode==="ambient"||!("speechSynthesis" in window);this.total=this.ambient?S.viz.ambientMin*60:estDur(s,this.scale());this.on=true;this.renderUI();this.play()},
 renderUI(){let el=$("#player");if(!el){el=document.createElement("div");el.id="player";el.className="player";document.body.appendChild(el)}
  el.innerHTML=`<div class="ptop"><button class="btn sm ghost" data-act="pl-exit" aria-label="Exit session">Exit</button><span class="mono small muted">${esc(this.s.title)}</span><button class="btn sm ghost" data-act="pl-dim">Dim</button></div>
  <div class="stack" style="gap:28px"><div class="ring live" id="pl-ring"></div><p class="line" id="pl-line" aria-live="polite">${this.ambient?"Ambient mode. Close your eyes and run the match in your head.":"Headphones on. Find a comfortable seat."}</p></div>
  <div class="pcontrols"><div class="stack" style="gap:6px"><div class="bar"><i id="pl-bar" style="width:0%"></i></div><div class="row between mono small muted"><span id="pl-el">0:00</span><span>${ENVS[S.viz.env].name}</span><span id="pl-tot">${fmtTime(this.total)}</span></div></div>
  <div class="row" style="justify-content:center;gap:22px"><button class="pbtn" data-act="pl-restart" aria-label="Restart">${RESTART}</button><button class="pbtn big" id="pl-pp" data-act="pl-pp" aria-label="Pause">${PAUSE}</button><button class="pbtn" data-act="pl-exit" aria-label="Stop">${STOP}</button></div>
  <label class="f small" style="font-weight:500">Volume<input type="range" id="pl-vol" min="0" max="1" step=".05" value="${S.viz.master}" data-act="mx" data-k="master"></label>
  <p class="small muted" style="text-align:center">🎧 Headphones recommended · tap anywhere to show controls</p></div>`;
  el.onclick=e=>{if(el.classList.contains("dim")){el.classList.remove("dim");e.stopPropagation();this.armDim()}};
  try{if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:this.s.title,artist:"Mat Mind · Visualization Room"});navigator.mediaSession.setActionHandler("pause",()=>this.pause());navigator.mediaSession.setActionHandler("play",()=>this.play())}}catch(e){}},
 armDim(){clearTimeout(this.dimT);if(S.viz.autoDim&&this.playing)this.dimT=setTimeout(()=>$("#player")?.classList.add("dim"),9000)},
 async play(){this.playing=true;try{Arena.start(S.viz.env,S.viz.mix||ENVS[S.viz.env].mix);Arena.setMaster(S.viz.master)}catch(e){toast("Audio isn't supported in this browser")}
  try{if(navigator.wakeLock)this.wake=await navigator.wakeLock.request("screen")}catch(e){}
  $("#pl-pp")&&($("#pl-pp").innerHTML=PAUSE,$("#pl-pp").setAttribute("aria-label","Pause"));$("#pl-ring")?.classList.add("live");
  clearInterval(this.tick);this.tick=setInterval(()=>{if(!this.playing)return;this.elapsed++;this.paint();if(this.ambient&&this.elapsed>=this.total)this.finish()},1000);
  if(!this.ambient)this.speakLine();this.armDim()},
 speakLine(){if(!this.playing)return;const L=this.s.lines[this.idx];if(!L){this.finish();return}const [t,p,cue]=L;$("#pl-line")&&($("#pl-line").textContent=t);if(cue)setTimeout(()=>Arena.cue(cue),400);
  const mix=S.viz.mix||ENVS[S.viz.env].mix;Arena.setDuck(.6,mix);
  Voice.say(t,{vol:S.viz.narr,onend:()=>{if(!this.playing)return;Arena.setDuck(1,mix);clearTimeout(this.wait);this.wait=setTimeout(()=>{this.idx++;this.speakLine()},p*this.scale()*1000)}})},
 pause(){this.playing=false;clearTimeout(this.wait);clearTimeout(this.dimT);Voice.cancel();Arena.stop();$("#player")?.classList.remove("dim");$("#pl-pp")&&($("#pl-pp").innerHTML=PLAY,$("#pl-pp").setAttribute("aria-label","Play"));$("#pl-ring")?.classList.remove("live")},
 toggle(){this.playing?this.pause():this.play()},
 restart(){this.pause();this.idx=0;this.elapsed=0;this.paint();this.play()},
 paint(){const pct=Math.min(100,this.elapsed/this.total*100);$("#pl-bar")&&($("#pl-bar").style.width=pct+"%");$("#pl-el")&&($("#pl-el").textContent=fmtTime(this.elapsed))},
 finish(){this.log(true);this.pause();$("#pl-line")&&($("#pl-line").textContent="Session complete. Take that feeling with you.");$("#pl-bar")&&($("#pl-bar").style.width="100%")},
 log(done){if(this.logged||this.elapsed<20)return;this.logged=true;S.vizLog.push({id:this.s.id,title:this.s.title,date:Date.now(),secs:this.elapsed,done});save()},
 exit(){this.log(this.elapsed>=this.total*.8);this.pause();this.on=false;this.logged=false;clearInterval(this.tick);try{this.wake&&this.wake.release()}catch(e){}$("#player")?.remove();route()}};
function estDur(s,scale=1){return s.lines.reduce((a,[t,p])=>a+t.split(/\s+/).length/2.3+p*scale+.4,0)}

/* ----- Breathing room ----- */
const PH=["Inhale","Hold","Exhale","Hold"];
const BR={running:false,paused:false,t0:0,acc:0,raf:null,lastPhase:-1,
 d(){const b=S.breath;return b.d.map((x,i)=>(i%2&&b.skipHolds)?0:x)},
 cycle(){return this.d().reduce((a,b)=>a+b,0)},
 rounds(){return Math.max(1,Math.round(S.breath.minutes*60/this.cycle()))},
 elapsed(){return this.acc+(this.running&&!this.paused?(performance.now()-this.t0)/1000:0)},
 start(){if(this.running)return;this.running=true;this.paused=false;this.acc=0;this.t0=performance.now();this.lastPhase=-1;if(S.breath.ambience)Arena.calm(true);else if(S.breath.voice)Arena.unlock();this.loop();this.paintControls()},
 pause(){if(!this.running||this.paused)return;this.acc=this.elapsed();this.paused=true;Voice.cancel();Arena.calm(false);this.paintControls()},
 resume(){if(!this.paused)return;this.paused=false;this.t0=performance.now();if(S.breath.ambience)Arena.calm(true);this.lastPhase=-1;this.loop();this.paintControls()},
 stop(silent){const secs=this.elapsed();cancelAnimationFrame(this.raf);if(this.running&&secs>=20){S.breathLog.push({date:Date.now(),secs:Math.round(secs),pattern:S.breath.pattern});save();if(!silent)toast("Logged "+fmtTime(secs)+" of breathing")}this.running=false;this.paused=false;this.acc=0;Voice.cancel();Arena.calm(false);if(!silent){this.paint();this.paintControls()}},
 restart(){this.stop(true);this.start()},
 state(){const d=this.d(),cyc=this.cycle(),el=this.elapsed(),total=this.rounds()*cyc;if(el>=total)return{done:true,el:total,round:this.rounds()};const inC=el%cyc;let acc=0,ph=0;for(;ph<4;ph++){if(inC<acc+d[ph])break;acc+=d[ph]}return{ph,frac:d[ph]?(inC-acc)/d[ph]:0,left:Math.ceil(acc+d[ph]-inC-1e-6),round:Math.floor(el/cyc)+1,el,total}},
 loop(){cancelAnimationFrame(this.raf);const step=()=>{if(!this.running||this.paused)return;const s=this.state();if(s.done){this.paint(s);if(S.breath.voice)Voice.say("Session complete.");this.stop();return}if(s.ph!==this.lastPhase){this.lastPhase=s.ph;if(S.breath.voice)Voice.say(PH[s.ph],{rate:.9})}this.paint(s);this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)},
 paint(st){const svg=$("#bx");if(!svg)return;const s=st||(this.running?this.state():null);const pts=[[20,300],[20,20],[300,20],[300,300],[20,300]];
  let x=20,y=300,ph=-1;if(s&&!s.done){ph=s.ph;const a=pts[ph],b=pts[ph+1];x=a[0]+(b[0]-a[0])*s.frac;y=a[1]+(b[1]-a[1])*s.frac}
  for(let i=0;i<4;i++){const e=$("#bs"+i);if(e)e.setAttribute("stroke",i===ph?"var(--red-hi)":"var(--line)")}
  const dot=$("#bdot");dot.setAttribute("cx",x);dot.setAttribute("cy",y);const glow=$("#bglow");glow.setAttribute("cx",x);glow.setAttribute("cy",y);
  $("#bcount").textContent=s?(s.done?"✓":s.left):this.d()[0];$("#bphase").textContent=s?(s.done?"Done":PH[s.ph]):"Ready";
  $("#bround").textContent=`Round ${s?Math.min(s.round,this.rounds()):1} of ${this.rounds()}`;$("#belapsed").textContent=fmtTime(s?s.el:0)+" / "+fmtTime(this.rounds()*this.cycle())},
 paintControls(){const c=$("#bctl");if(c)c.innerHTML=brControls()}};
function brControls(){if(!BR.running)return`<button class="btn red block" data-act="br-start">Start session</button>`;
 return`<div class="grid3"><button class="btn ${BR.paused?"red":""}" data-act="${BR.paused?"br-resume":"br-pause"}">${BR.paused?"Resume":"Pause"}</button><button class="btn" data-act="br-restart">Restart</button><button class="btn" data-act="br-end">End session</button></div>`}
RENDER.breathe=()=>{const b=S.breath;const pat=BREATH_PATTERNS.find(p=>p.id===b.pattern);
 return`<div class="stack-lg"><div class="stack"><div class="eyebrow">The Breathing Room</div><h1>Follow the four sides.</h1></div>
 <div class="box-wrap"><svg id="bx" viewBox="0 0 320 320" role="img" aria-label="Breathing guide">
  <line id="bs0" x1="20" y1="300" x2="20" y2="20" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><line id="bs1" x1="20" y1="20" x2="300" y2="20" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><line id="bs2" x1="300" y1="20" x2="300" y2="300" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><line id="bs3" x1="300" y1="300" x2="20" y2="300" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>

 <div class="stack"><h3>Intervals (seconds)</h3><div class="grid2">${PH.map((n,i)=>`<div class="tile" style="gap:8px"><span class="small muted">${n}</span><div class="row between"><button class="btn sm" data-act="br-step" data-i="${i}" data-dv="-1" aria-label="Less ${n}">−</button><span class="stat mono" style="font-size:1.6rem">${b.d[i]}</span><button class="btn sm" data-act="br-step" data-i="${i}" data-dv="1" aria-label="More ${n}">+</button></div></div>`).join("")}</div></div>
 <div class="card stack" style="gap:4px">${[["skipHolds","Skip holds (breathe in and out only)"],["voice","Voice guidance"],["ambience","Background ambience"]].map(([k,t])=>`<label class="check" style="border:0;padding:8px 0"><input type="checkbox" id="br-${k}" data-act="br-toggle" data-k="${k}" ${b[k]?"checked":""}><span>${t}</span></label>`).join("")}</div>
 ${S.breathLog.length?`<p class="small muted">${S.breathLog.length} sessions logged · ${Math.round(S.breathLog.reduce((a,x)=>a+x.secs,0)/60)} minutes total</p>`:""}</div>`};

/* ----- Coach (offline, guided) ----- */
const FL={id:null,step:0,ans:{},log:[],steps:[],saved:false};
function entryName(t){return(JOURNAL_TEMPLATES[t]||FLOWS[t]||{name:"Entry"}).name+(FLOWS[t]?(FLOWS[t].kind==="debrief"?" debrief":" · coach"):"")}
function flowFill(x){let t=typeof x==="function"?x(FL.ans):x;return t.replace(/\{name\}/g,S.profile.name||"")}
function flowStart(id){const f=FLOWS[id];if(!f)return;FL.id=id;FL.step=0;FL.ans={};FL.log=[];FL.saved=false;FL.steps=[...f.steps];
 const prev=S.flowPlans[id];if(f.kind==="topic"&&prev)FL.steps.unshift({ask:`Last time your plan was: "${prev}". How did it go?`,key:"review",type:"choice",opts:["It worked","Partly","Didn't get to it"]},{say:a=>({"It worked":"Good. That's evidence the approach works for you. Let's build on it.","Partly":"Partly is progress. Let's tighten it up so it's easier to stick with.","Didn't get to it":"No problem. Let's make the plan smaller and more specific this time."})[a.review]});
 flowAdvance();if(curView()==="coach")route();else go("coach")}
function flowAdvance(){while(FL.step<FL.steps.length){const st=FL.steps[FL.step];if(st.say){FL.log.push({r:"c",t:flowFill(st.say)});FL.step++;continue}if(st.bank){const v=(FL.ans[st.bank]||"").trim();if(v)S.bank.push({t:v,date:Date.now()});FL.step++;continue}break}
 const st=FL.steps[FL.step];if(st&&st.acts&&!FL.saved){FL.saved=true;const f=FLOWS[FL.id];const a={};FL.steps.forEach(s=>{if(s.ask&&FL.ans[s.key]!==undefined)a[s.ask.replace(/^Last time.*/,"Review of last plan")]=String(FL.ans[s.key])});S.journal.push({t:FL.id,date:Date.now(),a,rate:FL.ans.rate?+FL.ans.rate:null});if(f.kind==="topic"&&FL.ans.plan)S.flowPlans[FL.id]=FL.ans.plan;S.bank=S.bank.slice(-60);save()}}
function flowAnswer(v){const st=FL.steps[FL.step];if(!st||!st.ask)return;v=String(v??"").trim();if(!v){toast("Write a few words, even short is fine");return}
 FL.ans[st.key]=st.type==="scale"?+v:v;FL.log.push({r:"u",t:st.type==="scale"?v+" / 10":v});FL.step++;flowAdvance();route();setTimeout(()=>{const f=$("#flow-in");if(f)f.focus({preventScroll:true});$("#flow-end")?.scrollIntoView({block:"end",behavior:"smooth"})},30)}
function flowAct(v){const [k,x,y]=v.split(":");FL.id=null;

function lineChart(){const A=S.assessments;if(!A.length)return`<p class="muted small">Complete an assessment to see this chart.</p>`;
 const W=320,H=170,pl=26,pr=8,pt=10,pb=22;const n=A.length;const X=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1);const Y=v=>pt+(10-v)*(H-pt-pb)/9;
 const cols={confidence:"#e23441",discipline:"#f4f1ee",focus:"#d49b2b",emotion:"#46a86f",pressure:"#7aa7d9",resilience:"#b48ad6"};

 A.forEach((a,i)=>{if(n<=6||i%Math.ceil(n/6)===0)g+=`<text x="${X(i)}" y="${H-6}" fill="var(--dim)" font-size="10" text-anchor="middle" font-family="IBM Plex Mono,monospace">${fmtDate(a.date)}</text>`});
 for(const k in DIMS){const pts=A.map((a,i)=>`${X(i)},${Y(a.scores[k])}`).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${cols[k]}" stroke-width="2"/>`;const l=A[n-1];g+=`<circle cx="${X(n-1)}" cy="${Y(l.scores[k])}" r="3.5" fill="${cols[k]}"/>`}
 return`<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Self-ratings over time">${g}</svg></div><div class="row small" style="gap:12px">${Object.entries(DIMS).map(([k,n])=>`<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:${cols[k]};display:inline-block"></i>${n}</span>`).join("")}</div>`}
