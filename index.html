 if(a==="viz-autodim"){S.viz.autoDim=t.checked;save()}
 if(a==="br-toggle"){S.breath[t.dataset.k]=t.checked;save();if(!BR.running)route()}
 if(a==="comp-check"){S.comp.items[+t.dataset.i].d=t.checked;save()}});
document.addEventListener("submit",e=>{if(e.target.id!=="jform")return;e.preventDefault();const a={};let any=false;e.target.querySelectorAll("textarea").forEach(t=>{a[t.dataset.q]=t.value.trim();if(t.value.trim())any=true});const rb=e.target.querySelector('#j-rate [aria-pressed="true"]');if(!any&&!rb){toast("Write at least one answer");return}S.journal.push({t:jt,date:Date.now(),a,rate:rb?+rb.dataset.v:null});save();toast("Entry saved");route()});
document.addEventListener("keydown",e=>{if(e.target.id==="flow-in"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();flowAnswer(e.target.value)}});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
 const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,d=el.dataset;
 switch(a){
 case"ob-next":ob.step++;route();break;
 case"ob-back":if(ob.step<=1&&ob.active){ob.active=false;ob.step=0;route()}else{ob.step--;route()}break;
 case"ob-score":ob.scores[d.k]=+d.v;route();document.querySelector(`[data-k="${d.k}"][data-v="${d.v}"]`)?.focus({preventScroll:false});break;
 case"ob-finish":S.assessments.push({date:Date.now(),scores:{...ob.scores}});S.onboarded=true;ob.active=false;save();ob.step=0;go("profile");break;
 case"retake":ob.step=2;ob.scores={...(latestScores()||{})};ob.active=true;route();break;
 case"edit-profile":ob.step=1;ob.scores={...(latestScores()||{})};ob.active=true;route();break;
 case"mod-read":modState(d.id).read=true;checkModDone(+d.id);save();route();break;
 case"quiz":{const m=modState(d.id);m.quiz[d.q]=+d.o;checkModDone(+d.id);save();const y=window.scrollY;route();window.scrollTo(0,y);break}
 case"quiz-reset":{modState(d.id).quiz={};save();const y=window.scrollY;route();window.scrollTo(0,y);break}
 case"viz-env":S.viz.env=d.k;S.viz.mix=null;save();if(Arena.running)Arena.start(d.k);route();break;
 case"viz-set":S.viz[d.k]=d.k==="ambientMin"?+d.v:d.v;save();{const y=window.scrollY;route();window.scrollTo(0,y);document.querySelectorAll("details")[0].open=true}break;
 case"viz-open":if(Arena.running)Arena.stop(true);PL.open(d.id);break;
 case"mx-preview":if(Arena.running){Arena.stop()}else{Arena.start(S.viz.env,S.viz.mix||ENVS[S.viz.env].mix);Arena.setMaster(S.viz.master)}el.textContent=Arena.running?"Stop preview":"Preview arena";break;
 case"mx-reset":S.viz.mix=null;save();if(Arena.running)Arena.applyMix(ENVS[S.viz.env].mix);{const y=window.scrollY;route();window.scrollTo(0,y);document.querySelectorAll("details")[1].open=true}break;
 case"viz-gen":genViz();break;
 case"pl-pp":PL.toggle();break;
 case"pl-restart":PL.restart();break;
 case"pl-exit":PL.exit();break;
 case"pl-dim":e.stopPropagation();$("#player").classList.add("dim");break;
 case"br-start":BR.start();break;case"br-pause":BR.pause();break;case"br-resume":BR.resume();break;case"br-restart":BR.restart();break;case"br-end":BR.stop();break;
 case"br-pat":{if(BR.running)BR.stop(true);S.breath.pattern=d.p;const p=BREATH_PATTERNS.find(x=>x.id===d.p);if(p)S.breath.d=[...p.d];save();route();break}
 case"br-min":if(BR.running)BR.stop(true);S.breath.minutes=+d.v;save();route();break;
 case"br-step":{if(BR.running)BR.stop(true);const i=+d.i,min=i%2?0:2;S.breath.d[i]=Math.max(min,Math.min(10,S.breath.d[i]+ +d.dv));S.breath.pattern="custom";save();const y=window.scrollY;route();window.scrollTo(0,y);break}
 case"breath-quick":{if(S.breath.voice||S.breath.ambience){try{Arena.unlock()}catch(e){}}const p=BREATH_PATTERNS.find(x=>x.id===d.p)||BREATH_PATTERNS[0];S.breath.pattern=p.id;S.breath.d=[...p.d];S.breath.minutes=d.m?+d.m:2;save();go("breathe");setTimeout(()=>BR.start(),0);break}
 case"flow-start":flowStart(d.f);break;
 case"flow-choice":flowAnswer(d.v);break;
 case"flow-next":flowAnswer($("#flow-in")?$("#flow-in").value:"");break;
 case"flow-act":flowAct(d.v);break;
 case"flow-quit":FL.id=null;route();break;
 case"q-add":quoteAdd();break;
 case"q-core":{const q=S.quotes.find(x=>x.id===d.id);q.core=!q.core;save();route();break}
 case"q-del":qDel=d.id;route();break;case"q-del-no":qDel=null;route();break;
 case"q-del-yes":S.quotes=S.quotes.filter(x=>x.id!==d.id);qDel=null;save();route();break;
 case"q-save-daily":{const dq=dailyQuote();if(!S.quotes.some(x=>x.t===dq[0])){S.quotes.push({id:"q"+Date.now(),t:dq[0],a:dq[1],core:false,date:Date.now()});save();toast("Saved to My Quotes")}route();break}
 case"q-next":qOffset++;route();break;
 case"q-edit":qEdit=d.id;route();break;
 case"q-edit-save":{const q=S.quotes.find(x=>x.id===d.id);q.t=$("#qe-t").value.trim()||q.t;q.a=$("#qe-a").value.trim();qEdit=null;save();route();break}
 case"code-gen":genCode();break;
 case"code-copy":{const txt=S.code.doc;navigator.clipboard?.writeText(txt).then(()=>toast("Copied")).catch(()=>{const t=$("#code-doc");t.select();toast("Selected. Copy it from here.")});break}
 case"code-export":downloadsNs.save({filename:"My Wrestling Code.txt",data:S.code.doc}).then(()=>{}).catch(()=>{});break;
 case"j-tpl":jt=d.k;route();break;
 case"j-rate":el.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===el));break;
 case"prog-range":progRange=+d.v;route();break;
 case"comp-reset":S.comp.items.forEach(i=>i.d=false);S.comp.intent=["","",""];save();route();break;
 case"post":flowStart(d.k);break;
 case"ch-sel":chSel=+d.n;route();break;
 case"ch-done":{const n=+d.n;S.challenges[n]=Object.assign(S.challenges[n]||{},{done:true,date:Date.now()});save();chSel=null;toast("Day "+n+" complete");route();break}
 case"ch-undo":{S.challenges[+d.n].done=false;save();route();break}
 case"reset-ask":confirmReset=true;route();break;case"reset-no":confirmReset=false;route();break;
 case"reset-yes":confirmReset=false;S=DEFAULTS();S.updatedAt=Date.now();save();ob.step=0;ob.scores={};go("onboard");break;
 }});

function genViz(){const v=buildViz($("#cv-sit").value,$("#cv-skill").value,$("#cv-note").value);S.customViz.push(v);save();PL.open(v.id)}
